<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGV 任务时序动画</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#23334d;background:#f0f4fa}*{box-sizing:border-box}body{margin:0;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:25px;margin:0 0 8px}p{margin:0;color:#65758b;font-size:13px}.badge{background:#e0f4ea;color:#167148;border-radius:20px;padding:8px 16px;white-space:nowrap}.badge.blocked{background:#fff0d8;color:#925800}.notice{margin-top:16px;background:#fff3de;border:1px solid #eac689;border-radius:12px;padding:14px;overflow-wrap:anywhere}.panel{background:white;border:1px solid #dce4ef;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 4px 18px #283b5710}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #ccd8e8;border-radius:8px;background:white;padding:8px 13px;color:#23334d;cursor:pointer}button.primary{background:#245ce0;color:white;border-color:#245ce0}button:disabled{opacity:.4;cursor:default}input[type=range]{flex:1;min-width:160px;accent-color:#245ce0}.clock{font-variant-numeric:tabular-nums;min-width:160px;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.mapwrap{overflow:auto;max-height:660px;background:#f8faff;border-radius:10px}.map{display:block;width:100%;min-width:850px}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:#65758b;margin:12px 0}.swatch{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle;border-radius:3px}.vehicle-card{padding:12px 0;border-bottom:1px solid #e5ebf3;font-size:13px}.vehicle-card:last-child{border:0}.vehicle-name{font-weight:700;margin-bottom:6px}.sub{color:#65758b;font-size:12px;line-height:1.8}.progress{height:5px;border-radius:3px;background:#e5ebf3;margin-top:7px;overflow:hidden}.progress span{display:block;height:100%;background:#e8a23a}h2{font-size:16px;margin:0 0 12px}.timeline-wrap{overflow:auto}.timeline{width:100%;min-width:850px;display:block}.table-wrap{overflow:auto;max-height:300px}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{position:sticky;top:0;background:#f2f5fa;color:#65758b}td,th{padding:10px;border-bottom:1px solid #e5ebf3;white-space:nowrap}.status{font-weight:600}.summary{font-size:13px;color:#65758b;margin-left:auto}@media(max-width:1000px){.layout{grid-template-columns:1fr}body{padding:12px}header{align-items:flex-start}.summary{margin-left:0}}
</style>
</head>
<body>
<header><div><h1 id="title">AGV 任务时序动画</h1><p>站点连线示意 · 事件时刻同步 · 货物随车转运</p></div><span id="badge" class="badge"></span></header>
<div id="notice" class="notice" hidden></div>
<section class="panel controls">
<button id="play" class="primary">▶ 播放</button><button id="reset">回到开始</button><button id="step">下一事件</button>
<label>倍速 <select id="speed"><option value="0.2">0.2×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select></label>
<input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="仿真时间"><span id="clock" class="clock"></span>
<span id="summary" class="summary"></span>
</section>
<div class="layout">
<section class="panel"><h2>站点与运输</h2><div class="legend"><span><i class="swatch" style="background:#f3b64f"></i>货物（含未参与任务的货物）</span><span>虚线：空载 / 未派单请求</span><span>实线：载货运输</span><span>站点按巷道分组，连线不代表真实导航路径</span></div><div class="mapwrap"><svg id="map" class="map" role="img" aria-label="AGV 与货物动画"></svg></div></section>
<aside class="panel"><h2>AGV 实时状态</h2><div id="vehicles"></div><p id="rate" style="margin-top:16px"></p></aside>
</div>
<section class="panel"><h2>任务时间轴</h2><div class="legend"><span><i class="swatch" style="background:#afbdd0"></i>空载行驶</span><span><i class="swatch" style="background:#f3b64f"></i>装货 / 卸货</span><span><i class="swatch" style="background:#477bea"></i>载货行驶（按车辆颜色）</span></div><div class="timeline-wrap"><svg id="timeline" class="timeline" role="img" aria-label="任务时间轴"></svg></div></section>
<section class="panel"><h2>任务明细</h2><div class="table-wrap"><table><thead><tr><th>任务</th><th>货物</th><th>起点 → 终点</th><th>AGV</th><th>派单 / 取货完成 / 卸货完成（秒）</th><th>当前状态</th></tr></thead><tbody id="taskrows"></tbody></table></div></section>
<script id="schedule-data" type="application/json">__SCHEDULE_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('schedule-data').textContent);
const asArray=x=>x==null?[]:Array.isArray(x)?x:[x];
for(const k of ['stations','vehicles','cargo','tasks'])D[k]=asArray(D[k]);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const colors=['#336be4','#159b83','#9859d1','#dc6570','#bb7b21','#457e8d'];
const color=id=>colors[Math.max(0,D.vehicles.findIndex(v=>v.id===id))%colors.length];
const fmt=x=>typeof x==='number'?x.toFixed(2):'—';
const scheduled=D.tasks.filter(t=>t.vehicle!==0).sort((a,b)=>a.start-b.start||(a.dispatchOrder||0)-(b.dispatchOrder||0));
const events=[...new Set([0,D.duration,...scheduled.flatMap(t=>[t.start,t.arrivePickup,t.pickupFinish,t.arriveDropoff,t.finish])])].sort((a,b)=>a-b);
const vehicleTasks=new Map(D.vehicles.map(v=>[v.id,scheduled.filter(t=>t.vehicle===v.id)]));
function svg(parent,tag,attrs={},label){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(label!==undefined)e.textContent=label;parent.appendChild(e);return e;}
function phase(t,time){
 if(!t.vehicle)return time<t.release?'未下发':'未派单';
 if(time<t.start)return time<t.release?'未下发':'等待派单';
 if(time<t.arrivePickup)return '空载行驶';
 if(time<t.pickupFinish)return '装货';
 if(time<t.arriveDropoff)return '载货行驶';
 if(time<t.finish)return '卸货';
 return '已完成';
}
function snapshot(time){
 const vehicles=D.vehicles.map(v=>{
  let station=v.station,active=null;
  for(const t of vehicleTasks.get(v.id)){if(time>=t.finish){station=t.dropoff;continue;}if(time>=t.start)active=t;break;}
  let from=station,to=station,ratio=0,status='等待',cargo=null,progress=0;
  if(active){const t=active;status=phase(t,time);
   if(time<t.arrivePickup){from=t.from;to=t.pickup;ratio=(time-t.start)/(t.arrivePickup-t.start);}
   else if(time<t.pickupFinish){from=to=t.pickup;progress=(time-t.arrivePickup)/(t.pickupFinish-t.arrivePickup);}
   else if(time<t.arriveDropoff){from=t.pickup;to=t.dropoff;ratio=(time-t.pickupFinish)/(t.arriveDropoff-t.pickupFinish);cargo=t.cargo;}
   else{from=to=t.dropoff;cargo=t.cargo;progress=(time-t.arriveDropoff)/(t.finish-t.arriveDropoff);}
  }
  return {...v,from,to,ratio,status,cargo,progress,task:active};
 });
 const cargo=D.cargo.map(c=>{let station=c.station,onboard=false;for(const t of scheduled.filter(t=>t.cargo===c.id)){if(time>=t.finish){station=t.dropoff;continue;}if(time>=t.pickupFinish)onboard=true;break;}return {...c,station,onboard};});
 return {vehicles,cargo,completed:scheduled.filter(t=>time>=t.finish).length};
}
// Pure state reconstruction makes seeking backwards identical to forward playback.
window.AGVReplay={data:D,snapshot,phase,events};
$('title').textContent=`${D.label} · AGV 任务时序动画`;
$('badge').textContent=D.feasible?'调度可行':'调度受阻';$('badge').classList.toggle('blocked',!D.feasible);
if(!D.feasible){$('notice').hidden=false;$('notice').textContent=`当前方案受阻：${D.reason}。仅回放已派单任务；未派单任务保持原位。`;}
$('rate').textContent=`1× 播放：每秒推进 ${D.speed} 秒仿真时间。装卸完成后才更新货物归属。`;
const positions=new Map(),groups=new Map();
for(const s of D.stations){if(!groups.has(s.pocket))groups.set(s.pocket,[]);groups.get(s.pocket).push(s);}
const groupList=[...groups.entries()],cols=6,cw=185;let y=40;
for(let row=0;row<groupList.length;row+=cols){let height=0;
 for(let col=0;col<cols&&row+col<groupList.length;col++){
  const [name,stations]=groupList[row+col];stations.sort((a,b)=>a.sequence-b.sequence);const x=45+col*cw;
  svg($('map'),'text',{x,y,fill:'#74839a','font-size':12},name==='AGV start'?'AGV 初始站点':`巷道 ${name}`);
  stations.forEach((s,i)=>positions.set(s.id,{x:x+30,y:y+32+i*60}));
  height=Math.max(height,stations.length*60+65);
 }y+=height;
}
$('map').setAttribute('viewBox',`0 0 ${cols*cw+20} ${Math.max(150,y)}`);
const defs=svg($('map'),'defs');const marker=svg(defs,'marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});svg(marker,'path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#a3b2cb'});
const routeLayer=svg($('map'),'g'),stationLayer=svg($('map'),'g'),cargoLayer=svg($('map'),'g'),vehicleLayer=svg($('map'),'g');
const routes=[];
function route(from,to,t,empty){const a=positions.get(from),b=positions.get(to);if(!a||!b||from===to)return;
 const el=svg(routeLayer,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:t.vehicle?color(t.vehicle):'#9da9ba','stroke-width':1.5,'stroke-dasharray':empty||!t.vehicle?'5 6':'','marker-end':'url(#arrow)',opacity:.17});
 svg(el,'title',{},`T${t.id}: ${from} → ${to}${empty?'（空载）':''}`);routes.push({el,t,empty});}
for(const t of D.tasks){if(t.vehicle)route(t.from,t.pickup,t,true);route(t.pickup,t.dropoff,t,false);}
for(const s of D.stations){const p=positions.get(s.id),g=svg(stationLayer,'g');svg(g,'circle',{cx:p.x,cy:p.y,r:15,fill:'#fff',stroke:'#b2bfd1','stroke-width':2});svg(g,'text',{x:p.x,y:p.y+4,'text-anchor':'middle','font-size':11,fill:'#344560'},s.id);svg(g,'title',{},`站点 ${s.id} · ${s.pocket}`);}
const cargoNodes=D.cargo.map(c=>{const g=svg(cargoLayer,'g');svg(g,'rect',{x:20,y:-12,width:16,height:16,rx:3,fill:'#f3b64f',stroke:'#c28a27'});svg(g,'text',{x:40,y:1,'font-size':10,fill:'#856023'},c.id);return g;});
const vehicleNodes=D.vehicles.map(v=>{const g=svg(vehicleLayer,'g');svg(g,'rect',{x:-16,y:-10,width:32,height:20,rx:6,fill:color(v.id),stroke:'white','stroke-width':2});for(const x of [-10,10])for(const y of [-12,10])svg(g,'rect',{x:x-3,y,width:6,height:3,rx:1,fill:'#273851'});svg(g,'text',{x:0,y:4,'font-size':9,fill:'white','text-anchor':'middle'},String(v.id).padStart(2,'0'));svg(g,'text',{x:0,y:27,'font-size':10,fill:color(v.id),'text-anchor':'middle'},`AGV${String(v.id).padStart(2,'0')}`);const load=svg(g,'g');svg(load,'rect',{x:-8,y:-30,width:16,height:15,rx:3,fill:'#f3b64f',stroke:'#c28a27'});const text=svg(load,'text',{x:12,y:-18,'font-size':10,fill:'#856023'});return {g,load,text};});
const cards=D.vehicles.map(v=>{const card=document.createElement('div');card.className='vehicle-card';const name=document.createElement('div');name.className='vehicle-name';name.style.color=color(v.id);name.textContent=`AGV${String(v.id).padStart(2,'0')}`;const status=document.createElement('div'),detail=document.createElement('div');detail.className='sub';const progress=document.createElement('div');progress.className='progress';const bar=document.createElement('span');progress.append(bar);card.append(name,status,detail,progress);$('vehicles').append(card);return {status,detail,progress,bar};});
const rowNodes=D.tasks.map(t=>{const row=document.createElement('tr');for(const text of [`T${t.id}`,t.cargo,`${t.pickup} → ${t.dropoff}`,t.vehicle?`AGV${String(t.vehicle).padStart(2,'0')}`:'—',`${fmt(t.start)} / ${fmt(t.pickupFinish)} / ${fmt(t.finish)}`]){const cell=document.createElement('td');cell.textContent=text;row.append(cell);}const state=document.createElement('td');state.className='status';row.append(state);$('taskrows').append(row);return state;});
const tw=1100,left=90,right=25,scale=t=>left+t/Math.max(1,D.duration)*(tw-left-right),th=60+D.vehicles.length*46;
$('timeline').setAttribute('viewBox',`0 0 ${tw} ${th}`);
for(let i=0;i<=10;i++){const t=D.duration*i/10,x=scale(t);svg($('timeline'),'line',{x1:x,x2:x,y1:25,y2:th-20,stroke:'#e4eaf3'});svg($('timeline'),'text',{x,y:15,'text-anchor':'middle','font-size':10,fill:'#74839a'},fmt(t));}
D.vehicles.forEach((v,i)=>{const y=40+i*46;svg($('timeline'),'text',{x:0,y:y+12,'font-size':12,fill:color(v.id)},`AGV${String(v.id).padStart(2,'0')}`);
 for(const t of vehicleTasks.get(v.id)){
  const edges=[t.start,t.arrivePickup,t.pickupFinish,t.arriveDropoff,t.finish],fills=['#afbdd0','#f3b64f',color(v.id),'#f3b64f'];
  for(let j=0;j<4;j++)if(edges[j+1]>edges[j]){const r=svg($('timeline'),'rect',{x:scale(edges[j]),y,width:scale(edges[j+1])-scale(edges[j]),height:22,fill:fills[j],rx:2});svg(r,'title',{},`T${t.id} · ${['空载','装货','载货','卸货'][j]} · ${fmt(edges[j])}–${fmt(edges[j+1])}s`);}
  svg($('timeline'),'text',{x:scale(t.start)+3,y:y+34,'font-size':10,fill:'#53657d'},`T${t.id} · ${t.cargo}`);
 }
});
if(!scheduled.length)svg($('timeline'),'text',{x:250,y:50,fill:'#74839a','font-size':13},'没有已派单任务，可检查任务明细与受阻原因。');
const cursor=svg($('timeline'),'line',{x1:left,x2:left,y1:22,y2:th-15,stroke:'#e45656','stroke-width':2});
let time=0,playing=false,last=0;
function render(){const s=snapshot(time);$('clock').textContent=`${fmt(time)} / ${fmt(D.duration)} s`;$('seek').value=time;$('summary').textContent=`已完成 ${s.completed} / ${D.tasks.length} 个任务`;
 s.cargo.forEach((c,i)=>{const p=positions.get(c.station);cargoNodes[i].style.display=c.onboard?'none':'';cargoNodes[i].setAttribute('transform',`translate(${p.x},${p.y})`);});
 s.vehicles.forEach((v,i)=>{const a=positions.get(v.from),b=positions.get(v.to),x=a.x+(b.x-a.x)*v.ratio,y=a.y+(b.y-a.y)*v.ratio;const peers=s.vehicles.filter(o=>o.from===v.from&&o.to===v.to&&o.ratio===v.ratio),offset=peers.findIndex(o=>o.id===v.id)*38;vehicleNodes[i].g.setAttribute('transform',`translate(${x-18-offset},${y-25})`);vehicleNodes[i].load.style.display=v.cargo?'':'none';vehicleNodes[i].text.textContent=v.cargo||'';cards[i].status.textContent=v.status+(v.task?` · T${v.task.id}`:'');cards[i].detail.textContent=v.task?`${v.from} → ${v.to} · ${v.cargo||'空载'}`:`停在站点 ${v.from}`;cards[i].progress.hidden=!['装货','卸货'].includes(v.status);cards[i].bar.style.width=`${v.progress*100}%`;});
 routes.forEach(({el,t,empty})=>{const active=t.vehicle&&(empty?time>=t.start&&time<t.arrivePickup:time>=t.pickupFinish&&time<t.arriveDropoff);el.setAttribute('opacity',active?.9:.14);el.setAttribute('stroke-width',active?3:1.5);});
 rowNodes.forEach((node,i)=>{node.textContent=phase(D.tasks[i],time);node.style.color=node.textContent==='已完成'?'#167148':'#53657d';});cursor.setAttribute('x1',scale(time));cursor.setAttribute('x2',scale(time));$('step').disabled=!events.some(e=>e>time);}
function pause(){playing=false;$('play').textContent='▶ 播放';}
$('seek').max=Math.max(1,D.duration);$('seek').disabled=D.duration===0;$('play').disabled=D.duration===0;
$('play').onclick=()=>{if(playing){pause();return;}if(time>=D.duration)time=0;playing=true;last=performance.now();$('play').textContent='Ⅱ 暂停';render();};
$('reset').onclick=()=>{pause();time=0;render();};$('seek').oninput=()=>{pause();time=Math.min(D.duration,Number($('seek').value));render();};$('step').onclick=()=>{pause();time=events.find(e=>e>time)??D.duration;render();};
function tick(now){if(playing){time=Math.min(D.duration,time+(now-last)/1000*D.speed*Number($('speed').value));if(time>=D.duration)pause();render();}last=now;requestAnimationFrame(tick);}
render();requestAnimationFrame(tick);
</script>
</body>
</html>
